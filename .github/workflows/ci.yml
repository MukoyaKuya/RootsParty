name: CI

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-secret-key-for-tests-only-change-in-production"
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      RECAPTCHA_TESTING: "True"
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Django checks
        run: python manage.py check

      - name: Tests
        run: python manage.py test core users finance commerce aspirants
