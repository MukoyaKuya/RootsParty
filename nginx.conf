worker_processes 1;
user nobody nogroup;
pid /tmp/nginx.pid;
error_log /dev/stdout info;

events {
    worker_connections 1024;
    accept_mutex off;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    sendfile on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        # Cloud Run sets the PORT env variable, but Nginx doesn't read env vars directly in config (without modules/envsubst).
        # We will use envsubst in start.sh to replace $PORT with the actual port number.
        listen $PORT default_server;
        server_name _;

        client_max_body_size 10M;
        keepalive_timeout 5;

        # Hide nginx version
        server_tokens off;

        # Serve Static Files Directly
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Serve Media Files Directly (if local/filesystem storage is used, mostly for dev/staging)
        # Note: Production uses GCS, so this is a fallback or for local run.
        location /media/ {
            alias /app/media/;
        }

        # Health checks (Cloud Run uses / or custom path)
        location /_health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Proxy to Gunicorn
        location / {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_pass http://unix:/tmp/gunicorn.sock;
        }
    }
}
