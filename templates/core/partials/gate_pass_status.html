<div class="status-content">
    <div class="flex items-center space-x-4 mb-6">
        <div class="w-12 h-12 border-4 border-t-roots-red border-roots-black rounded-full animate-spin"></div>
        <p class="text-2xl font-bold uppercase tracking-tighter">
            {% if status == 'processing' %}
                Still processing...
            {% else %}
                Finalizing documents...
            {% endif %}
        </p>
    </div>
    <p class="text-xl mb-4 italic">Event: {{ gate_pass.event.title|upper }}</p>
    <div class="bg-roots-black text-white p-4 font-bold border-2 border-roots-red">
        HOLD ON, COMRADE. THE REVOLUTION IS BEING DIGITIZED.
    </div>
</div>
