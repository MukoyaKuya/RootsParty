{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-roots-black text-white flex flex-col items-center justify-center p-6 font-mono">
    <div class="max-w-2xl w-full border-4 border-roots-red p-8 bg-white text-roots-black shadow-[12px_12px_0px_0px_rgba(230,0,0,1)]">
        <h1 class="text-5xl font-black uppercase mb-6 italic">
            Building Aspirant <span class="text-roots-red">Profile</span>
        </h1>
        
        <div id="status-container" 
             hx-get="{% url 'aspirants:check_aspirant_profile_status' aspirant.uuid %}" 
             hx-trigger="load, every 2s" 
             hx-swap="innerHTML">
            <div class="flex items-center space-x-4">
                <div class="w-10 h-10 border-4 border-t-roots-red border-roots-black rounded-full animate-spin"></div>
                <p class="text-xl font-bold uppercase">Preparing document for {{ aspirant.surname }}...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
