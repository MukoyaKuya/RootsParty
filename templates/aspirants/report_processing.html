{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-roots-black text-white flex flex-col items-center justify-center p-6 font-mono">
    <div class="max-w-3xl w-full border-4 border-roots-red p-10 bg-white text-roots-black shadow-[15px_15px_0px_0px_rgba(230,0,0,1)]">
        <h1 class="text-6xl font-black uppercase mb-8 leading-none">
            Consolidating <span class="bg-roots-red text-white px-2">Aspirant Data</span>
        </h1>
        
        <div id="status-container" 
             hx-get="{% url 'aspirants:check_aspirant_report_status' report.id %}" 
             hx-trigger="load, every 3s" 
             hx-swap="innerHTML">
            <div class="p-4 border-2 border-roots-black bg-gray-100">
                <div class="flex items-center space-x-4 mb-4">
                    <div class="w-12 h-12 border-4 border-t-roots-red border-roots-black rounded-full animate-spin"></div>
                    <p class="text-2xl font-bold uppercase tracking-tight">Compiling Official Report...</p>
                </div>
                <p class="text-sm uppercase opacity-70">This may take a few moments for large datasets.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
